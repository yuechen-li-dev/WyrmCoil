[package]
name = "wyrmcoil"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]
members = [
    ".",
    "src/Dunewyrm",
    "src/Game",
    "src/Scene",
    "src/Margaret/margaret-core",
    "src/Margaret/margaret-image",
    "src/Margaret/margaret-testutil",
    "src/Margaret/margaret-cpu",
    "src/Margaret/margaret-cli",
    "src/Margaret/margaret-vk",
]
default-members = [".", "src/Dunewyrm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
margaret-core = { path = "src/Margaret/margaret-core" }
margaret-image = { path = "src/Margaret/margaret-image" }
margaret-testutil = { path = "src/Margaret/margaret-testutil" }
margaret-cpu = { path = "src/Margaret/margaret-cpu" }

[dependencies]
dunewyrm = { path = "src/Dunewyrm" }
winit = "0.30"
wgpu = "24"
gltf = "=1.4.1"
getrandom = "0.3.4"
urlencoding = "2.1"
margaret-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
toml = "0.8"
wyrmcoil-game = { path = "src/Game" }

[target.'cfg(target_os = "windows")'.dependencies]
ash = "0.38"

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Security"] }

[lib]
name = "wyrmcoil"
path = "src/lib.rs"

[workspace.lints.rust]
non_snake_case = "allow"

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[lints]
workspace = true
